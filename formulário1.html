```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Jr. - Suporte</title>
</head>

<body>

    <header>
        <h1>WhatsApp Jr.</h1>
        <p>Central de Suporte</p>
    </header>

    <main>

        <h2>Formulário de Suporte</h2>

        <p>
            Preencha o formulário abaixo para entrar em contato
            com nossa equipe de suporte.
        </p>

        <form action="#" method="post">

            <!-- Dados do usuário -->
            <fieldset>

                <legend>Seus dados</legend>

                <label for="nome">Nome completo:</label>
                <br>
                <input 
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required
                >

                <br><br>

                <label for="email">E-mail:</label>
                <br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <br><br>

                <label for="telefone">Telefone:</label>
                <br>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >

            </fieldset>

            <br>

            <!-- Informações do problema -->
            <fieldset>

                <legend>Problema</legend>

                <label for="categoria">Qual é o problema?</label>
                <br>

                <select id="categoria" name="categoria" required>

                    <option value="">
                        Selecione uma opção
                    </option>

                    <option value="login">
                        Não consigo entrar na minha conta
                    </option>

                    <option value="cadastro">
                        Problema no cadastro
                    </option>

                    <option value="mensagem">
                        Problema ao enviar mensagens
                    </option>

                    <option value="receber">
                        Problema ao receber mensagens
                    </option>

                    <option value="contato">
                        Problema com contatos
                    </option>

                    <option value="seguranca">
                        Problema de segurança
                    </option>

                    <option value="outro">
                        Outro problema
                    </option>

                </select>

                <br><br>

                <label>Qual é a prioridade do problema?</label>

                <br>

                <input
                    type="radio"
                    id="baixa"
                    name="prioridade"
                    value="baixa"
                    required
                >
                <label for="baixa">Baixa</label>

                <br>

                <input
                    type="radio"
                    id="media"
                    name="prioridade"
                    value="media"
                >
                <label for="media">Média</label>

                <br>

                <input
                    type="radio"
                    id="alta"
                    name="prioridade"
                    value="alta"
                >
                <label for="alta">Alta</label>

                <br><br>

                <label for="descricao">
                    Descreva detalhadamente o problema:
                </label>

                <br>

                <textarea
                    id="descricao"
                    name="descricao"
                    rows="8"
                    cols="50"
                    placeholder="Explique o que aconteceu..."
                    required
                ></textarea>

            </fieldset>

            <br>

            <!-- Preferência de contato -->
            <fieldset>

                <legend>Preferência de contato</legend>

                <label for="contato">
                    Como você prefere receber uma resposta?
                </label>

                <br>

                <select id="contato" name="contato" required>

                    <option value="">
                        Selecione uma opção
                    </option>

                    <option value="email">
                        E-mail
                    </option>

                    <option value="telefone">
                        Telefone
                    </option>

                    <option value="whatsapp">
                        WhatsApp
                    </option>

                </select>

            </fieldset>

            <br>

            <!-- Confirmação -->
            <fieldset>

                <legend>Confirmação</legend>

                <input
                    type="checkbox"
                    id="confirmacao"
                    name="confirmacao"
                    required
                >

                <label for="confirmacao">
                    Confirmo que as informações fornecidas
                    estão corretas.
                </label>

            </fieldset>

            <br>

            <!-- Botões -->

            <button type="submit">
                Enviar solicitação
            </button>

            <button type="reset">
                Limpar formulário
            </button>

        </form>

    </main>

    <footer>

        <p>
            &copy; 2026 WhatsApp Jr. - Central de Suporte
        </p>

    </footer>

</body>

</html>
```
