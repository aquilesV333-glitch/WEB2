```html
<!-- SEÇÃO PARA AJUDAR NO PROJETO -->

<section>

    <h2> Faça parte do WhatsApp Jr.!</h2>

    <p>
        Gostou do nosso projeto e quer ajudar o WhatsApp Jr. a crescer?
    </p>

    <p>
        Sua participação pode fazer a diferença!
        Conte para nós como você gostaria de contribuir.
    </p>

    <form action="#" method="post">

        <fieldset>

            <legend>Quero ajudar o WhatsApp Jr.</legend>

            <!-- NOME -->

            <label for="nome">
                Nome completo:
            </label>

            <br>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <br><br>

            <!-- EMAIL -->

            <label for="email">
                E-mail:
            </label>

            <br>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >

            <br><br>

            <!-- TELEFONE -->

            <label for="telefone">
                Telefone:
            </label>

            <br>

            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(00) 00000-0000"
            >

            <br><br>

            <!-- COMO AJUDAR -->

            <label for="ajuda">
                Como você gostaria de ajudar?
            </label>

            <br><br>

            <select
                id="ajuda"
                name="ajuda"
                required
            >

                <option value="">
                    Escolha uma opção
                </option>

                <option value="programacao">
                    Programação
                </option>

                <option value="design">
                    Design e aparência do site
                </option>

                <option value="ideias">
                    Dar ideias e sugestões
                </option>

                <option value="divulgacao">
                    Divulgação do projeto
                </option>

                <option value="testes">
                    Testar o WhatsApp Jr.
                </option>

                <option value="conteudo">
                    Criar conteúdos
                </option>

                <option value="outro">
                    Outra forma de ajudar
                </option>

            </select>

            <br><br>

            <!-- EXPERIÊNCIA -->

            <label for="experiencia">
                Você possui experiência na área?
            </label>

            <br><br>

            <input
                type="radio"
                id="experiencia-sim"
                name="experiencia"
                value="sim"
                required
            >

            <label for="experiencia-sim">
                Sim
            </label>

            <br>

            <input
                type="radio"
                id="experiencia-nao"
                name="experiencia"
                value="nao"
            >

            <label for="experiencia-nao">
                Não, mas quero aprender
            </label>

            <br><br>

            <!-- HABILIDADES -->

            <label for="habilidades">
                Quais são suas habilidades?
            </label>

            <br><br>

            <textarea
                id="habilidades"
                name="habilidades"
                rows="5"
                cols="50"
                placeholder="Conte um pouco sobre suas habilidades..."
            ></textarea>

            <br><br>

            <!-- IDEIAS -->

            <label for="ideias">
                Você tem alguma ideia para melhorar o WhatsApp Jr.?
            </label>

            <br><br>

            <textarea
                id="ideias"
                name="ideias"
                rows="6"
                cols="50"
                placeholder="Conte sua ideia para nós..."
            ></textarea>

            <br><br>

            <!-- DISPONIBILIDADE -->

            <label for="disponibilidade">
                Quanto tempo você poderia dedicar ao projeto?
            </label>

            <br><br>

            <select
                id="disponibilidade"
                name="disponibilidade"
                required
            >

                <option value="">
                    Escolha uma opção
                </option>

                <option value="pouco">
                    Poucas horas por semana
                </option>

                <option value="medio">
                    Algumas horas por semana
                </option>

                <option value="muito">
                    Várias horas por semana
                </option>

                <option value="flexivel">
                    Tenho disponibilidade flexível
                </option>

            </select>

            <br><br>

            <!-- MOTIVAÇÃO -->

            <label for="motivacao">
                Por que você gostaria de ajudar o WhatsApp Jr.?
            </label>

            <br><br>

            <textarea
                id="motivacao"
                name="motivacao"
                rows="6"
                cols="50"
                placeholder="Conte para nós..."
                required
            ></textarea>

            <br><br>

            <!-- CONFIRMAÇÃO -->

            <input
                type="checkbox"
                id="interesse"
                name="interesse"
                required
            >

            <label for="interesse">
                Tenho interesse em fazer parte do projeto
                WhatsApp Jr.
            </label>

            <br><br>

            <!-- BOTÕES -->

            <button type="submit">
                🚀 Quero ajudar!
            </button>

            <button type="reset">
                Limpar formulário
            </button>

        </fieldset>

    </form>

</section>
```
